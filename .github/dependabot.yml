version: 2
updates:
  # Bumps carry no user-facing change, so they never need a towncrier changelog
  # fragment. Self-apply skip-changelog so the changelog gate's existing label
  # escape hatch exempts them — this keeps the enforcement workflow bot-agnostic
  # (it survives a future move off Dependabot without a workflow edit). Note:
  # setting `labels` replaces Dependabot's defaults, so the otherwise-automatic
  # dependencies/ecosystem labels are restated here.
  #
  # Minor and patch bumps batch into one PR per ecosystem. A major is left out
  # of every non-Actions group so a breaking change arrives on its own,
  # attributable to a single dependency instead of hiding among a dozen safe
  # ones. Security updates ignore groups entirely and always arrive alone.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns:
          - "*"
        exclude-patterns:
          - "async-nats"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
      - skip-changelog
  # The Actions group takes majors too, unlike the others. An action major is
  # normally a runner or Node version bump rather than an API break, so the
  # attributability that keeps majors solo elsewhere buys little here — and
  # holding them out produced a standing queue of one-line PRs nobody merged.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github_actions
      - skip-changelog
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
      - skip-changelog

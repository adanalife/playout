# Tag-triggered release of the playout image, via the shared release-image
# workflow (adanalife/infra). Public package — this repo is public, so cluster
# pulls need no imagePullSecret.
name: release
on:
  push:
    tags:
      - v*
  # Rebuild an existing tag. `tag` builds it with this revision's workflow
  # (`gh workflow run release.yml --ref main -f tag=vX.Y.Z`); dispatching at the
  # tag itself runs the workflow file as it was when the tag was cut, so a tag
  # whose release failed on a since-fixed workflow bug can't be rebuilt that way.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (default: the dispatched ref)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    uses: adanalife/infra/.github/workflows/release-image.yml@main
    with:
      image: playout
      tag: ${{ inputs.tag }}
      build-args: SHA=${{ github.sha }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

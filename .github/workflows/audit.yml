name: audit

# RustSec advisory scan of Cargo.lock — the Rust counterpart of tripbot's
# govulncheck. Runs on PRs/main for changed deps, plus a weekly cron because
# advisories land against already-pinned versions independent of any commit
# (scheduled failures file an issue instead of failing a check).
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 12 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# checks: write lets audit-check publish its findings as a check run with the
# advisories annotated. Without it the create-check API 403s, the action guesses
# it must be running on a fork, and falls back to printing the report into the
# job log — where the reason the job failed is thirty lines below the failure.
permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

name: pre-commit

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    uses: adanalife/infra/.github/workflows/hooks.yml@main
    with:
      runs-on: ubuntu-latest
      # rustfmt for the cargo-fmt hook.
      rust: true

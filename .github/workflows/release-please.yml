name: release-please
# Trunk-based release flow, run by infra's shared release-please workflow: a
# standing release PR on main (the next version + prod pin), with the towncrier
# changelog built onto its branch. The prod dist needs no re-synth here —
# release-please rewrites cdk8s/versions.yaml and the committed dist directly
# via extra-files. Merging the release PR creates the vX.Y.Z tag + GitHub
# Release, and the tag fires release.yml on its own.
#
# workflow_dispatch is the escape hatch for a stale release branch:
# release-please only rebuilds the PR when a *releasable* commit lands, so a
# run of chore-only merges leaves the branch on an old base. Dispatching
# rebases it off current main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    uses: adanalife/infra/.github/workflows/release-please.yml@main
    with:
      runs-on: ubuntu-latest
      # The rust release type names the release branch after the crate.
      branch: release-please--branches--main--components--playout
    secrets: inherit

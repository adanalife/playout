name: dev-image
# Floating :main image on every main push — what stage-1 deploys
# (imagePullPolicy: Always picks up rebuilds under the tag). amd64 only,
# same rationale as release.yml.
# A failed build alerts Discord through the shared workflow's alert job, so
# :main freezing on the previous commit does not go unnoticed.
on:
  push:
    branches:
      - main

# Only build the newest main merge: two close-together pushes would race to
# tag :main and the older build finishing last would clobber it. (release.yml
# is deliberately NOT guarded: cancelling could drop a version; immutable
# per-version tags are safe.)
concurrency:
  group: dev-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: adanalife/infra/.github/workflows/image.yml@main
    with:
      image: playout
      build-args: SHA=${{ github.sha }}
    secrets:
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: playout-instagram
    app.kubernetes.io/instance: playout-instagram
    app.kubernetes.io/name: playout
    app.kubernetes.io/part-of: tripbot
  name: playout-instagram-config
  namespace: stage-1
data:
  VIDEO_DIR: /opt/data/Dashcam/_all
  PARKED_DIRS: /opt/data/parked/s2/clips,/opt/data/parked/s2fast/clips,/opt/data/parked/s2/pieces
  OUTPUT: rtsp
  ENCODER: passthrough
  RTSP_URL: rtsp://mediamtx-instagram:8554/dashcam
  NATS_URL: nats://nats.stage-1-platform.svc.cluster.local:4222
  ENV: staging
  STREAM_PLATFORM: instagram
  DEPLOYMENT_ENVIRONMENT: stage-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://k8s-monitoring-alloy-receiver.monitoring.svc:4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: playout-instagram
    app.kubernetes.io/instance: playout-instagram
    app.kubernetes.io/name: playout
    app.kubernetes.io/part-of: tripbot
  name: playout-instagram
  namespace: stage-1
spec:
  replicas: 0
  selector:
    matchLabels:
      app: playout-instagram
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: playout-instagram
        app.kubernetes.io/name: playout
        app.kubernetes.io/instance: playout-instagram
        app.kubernetes.io/part-of: tripbot
      annotations:
        adanalife.dev/config-hash: b773c0d461
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: playout
          image: ghcr.io/adanalife/playout:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: playout-instagram-config
            - secretRef:
                name: sentry-playout
                optional: true
          env:
            - name: MALLOC_ARENA_MAX
              value: "2"
          volumeMounts:
            - name: dashcam
              mountPath: /opt/data/Dashcam/_all
              readOnly: true
            - name: parked
              mountPath: /opt/data/parked
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: 512Mi
            limits:
              memory: 1Gi
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
      volumes:
        - name: dashcam
          persistentVolumeClaim:
            claimName: vlc-dashcam
            readOnly: true
        - name: parked
          persistentVolumeClaim:
            claimName: dashcam-parked
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: playout-instagram
    app.kubernetes.io/instance: playout-instagram
    app.kubernetes.io/name: playout
    app.kubernetes.io/part-of: tripbot
  name: playout-instagram
  namespace: stage-1
spec:
  selector:
    app: playout-instagram
  ports:
    - name: http
      port: 8080
      targetPort: http

# Install both the pre-commit (file-content) hooks and the commit-msg hook
# (the Conventional Commits check at the bottom) on a plain `pre-commit install`.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Git style
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-new-submodules
      - id: no-commit-to-branch

      # Common errors
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-executables-have-shebangs

      # Cross platform
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

      # Security
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key

  # Secrets: broad scan layered on top of the narrow checks above.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # GitHub Actions workflow linting.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Dockerfile linting. The plain `hadolint` hook, not `hadolint-docker`: the
  # docker variant runs hadolint through the runner's Docker daemon, and on the
  # self-hosted runners that `docker run` takes the whole node down. This one
  # runs the binary mise puts on PATH (see .tool-versions), which also keeps the
  # hook usable on a laptop with Docker stopped.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint

  # No hook may run through a Docker daemon: a `docker run` on the self-hosted
  # runners takes the node down, and the whole fleet has been cleared of the
  # class once already. Cheaper to fail the config than to rediscover it.
  - repo: local
    hooks:
      - id: forbid-docker-image-hooks
        name: "forbid `language: docker_image` hooks"
        language: pygrep
        entry: '^\s*language:\s*[''"]?docker_image'
        files: ^\.pre-commit-config\.yaml$

  # Rust formatting. Wrapped in `mise exec` so it resolves the repo-pinned
  # toolchain on hosts where mise isn't activated in the hook's shell.
  # Clippy stays in CI (testing.yml) — a full build is too slow for a hook.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: mise exec -- cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

  # Conventional Commits — enforce `type(scope): summary` on commit messages so
  # history stays machine-parseable: it underpins release automation and gives
  # every contributor/agent the same commit grammar without re-explaining it.
  # Runs at the commit-msg stage; default_install_hook_types (top of file) wires
  # it up on `pre-commit install`. Guards LOCAL commits — and since PRs
  # squash-merge, the PR *title* becomes the squash subject, so keep PR titles
  # conventional too.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

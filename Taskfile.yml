version: '3'

vars:
  # The sibling checkouts (tripbot, platform-gateway) sit next to this repo's
  # *main* worktree, which is not the working directory when a task runs from
  # ~/adanalife/worktrees/ — there, `..` is the worktrees dir. `--git-common-dir`
  # always names the shared .git regardless of which worktree asks, so its
  # grandparent is the siblings' parent either way. `--path-format=absolute`
  # matters: from the main checkout the common dir is the relative `.git`, whose
  # grandparent would otherwise be `.`.
  SIBLINGS:
    sh: dirname "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"

tasks:
  build:
    desc: Build the playout binary
    cmds:
      - mise exec -- cargo build

  test:
    desc: Run tests
    cmds:
      - mise exec -- cargo test

  lint:
    desc: Clippy with warnings as errors (same gate as CI)
    cmds:
      - mise exec -- cargo clippy --all-targets -- -D warnings

  fmt:
    desc: Format the code
    cmds:
      - mise exec -- cargo fmt --all

  run:
    desc: 'Run playout against a video dir (VIDEO_DIR=... task run)'
    cmds:
      - mise exec -- cargo run

  cdk8s:synth:
    desc: Re-synthesize the committed k8s manifests in cdk8s/dist/
    cmds:
      - uv run --group cdk8s python cdk8s/main.py

  # Schema-validate the committed cdk8s/dist/ (what Argo actually applies)
  # against the cluster's k8s API version — catches API-version drift after a
  # k8s bump. CRD kinds resolve via the datree CRDs-catalog; anything not
  # there is skipped, not failed. Globbed to the *.k8s.yaml manifests only —
  # dist/apps/ holds a plain-JSON discovery index for infra's ApplicationSet,
  # not k8s resources. The {{`{{.Group}}`}} backtick wrapping keeps
  # kubeconform's URL template out of Task's own templating. Mirrored in
  # pr-gates.yml.
  cdk8s:validate:
    desc: Validate the committed cdk8s/dist/ manifests against the k8s API schemas (kubeconform)
    cmds:
      # -kubernetes-version tracks the live cluster (kubectl version); bump it with talos upgrades
      - mise exec -- kubeconform -strict -summary -kubernetes-version 1.36.0 -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{`{{.Group}}`}}/{{`{{.ResourceKind}}`}}_{{`{{.ResourceAPIVersion}}`}}.json' -ignore-missing-schemas cdk8s/dist/*.k8s.yaml

  # contract.json is the canonical service-name/port/env-key vocabulary, owned
  # by tripbot (generated from its pkg/contract Go constants) and synced into
  # this repo. cdk8s reads playout's own Service name and HTTP port from it;
  # never hand-edit it here.
  contract:sync:
    desc: Re-sync contract.json from the sibling tripbot checkout (the source of truth)
    cmds:
      - cp {{.SIBLINGS}}/tripbot/pkg/contract/contract.json contract.json

  # platforms.json is the fleet-wide supported-platform set, owned by
  # platform-gateway (its Go adapter registry is the source of truth) and synced
  # into this repo. cdk8s reads it into SUPPORTED_PLATFORMS; never hand-edit it here.
  platforms:sync:
    desc: Re-sync platforms.json from the sibling platform-gateway checkout (the source of truth)
    cmds:
      - cp {{.SIBLINGS}}/platform-gateway/platforms.json platforms.json

  # Changelog (towncrier). Fragments live in changelog.d/; assembled into
  # CHANGELOG.md at release time. Run on the host via uvx — no project dep.
  changelog:add:
    desc: 'Scaffold a changelog fragment (TYPE=fix, optional SLUG=my-thing; CI numbers it on push). Pass PR=42 to name it directly. Types: added changed deprecated removed fix security ci misc summary'
    vars:
      TYPE: '{{.TYPE | default "misc"}}'
      # No PR yet? Drop a "+" placeholder (towncrier's issue-less convention) —
      # changelog-number.yml renames it to <PR#>.<type>.md once the PR is open.
      NAME: '{{if .PR}}{{.PR}}{{else}}+{{.SLUG | default .TYPE}}{{end}}'
    cmds:
      - uvx towncrier create --config towncrier.toml {{.NAME}}.{{.TYPE}}.md

  changelog:preview:
    desc: Preview the pending changelog from the current fragments (towncrier draft)
    cmds:
      - uvx towncrier build --draft --config towncrier.toml --version Unreleased

  changelog:build:
    desc: Collate fragments into CHANGELOG.md for a release + delete them (VERSION=1.2.0)
    requires:
      vars: [VERSION]
    preconditions:
      - sh: 'echo "{{.VERSION}}" | grep -qE "^v?[0-9]+\.[0-9]+\.[0-9]+$"'
        msg: "VERSION must be an explicit release version like 1.2.0 (got '{{.VERSION}}'). Pass VERSION=x.y.z."
    cmds:
      - uvx towncrier build --yes --config towncrier.toml --version {{trimPrefix "v" .VERSION}}

  mediamtx:
    desc: Run a local MediaMTX (RTSP on :8554) for playout to publish into
    cmds:
      - mediamtx mediamtx.yml

  probe:
    desc: Watch the published stream's packets for boundary EOFs / PTS jumps
    cmds:
      - ffprobe -v warning -show_packets -select_streams v -i rtsp://localhost:8554/dashcam

  play:
    desc: Eyeball the published stream
    cmds:
      - ffplay -v warning rtsp://localhost:8554/dashcam
